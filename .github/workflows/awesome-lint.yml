name: awesome-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON Schema and Data Integrity
        run: node scripts/validate-data.js
      - name: Validate SSOT Parity between JSON and READMEs
        run: node scripts/validate-parity.js
      - name: Run Official Awesome Lint
        run: npx awesome-lint
